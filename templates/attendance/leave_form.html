{% extends 'base.html' %}
{% block page_title %}Apply Leave{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
  <div class="card p-4">
    <h5 class="fw-bold mb-4">Apply for Leave</h5>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label fw-semibold">{{ field.label }}</label>{{ field }}
        {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
      </div>
      {% endfor %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Submit Request</button>
        <a href="{% url 'attendance:leave_list' %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div></div>
{% endblock %}
