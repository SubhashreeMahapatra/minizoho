{% extends 'base.html' %}
{% block page_title %}Check In{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card p-4 text-center">
    <i class="fas fa-sign-in-alt fa-3x text-success mb-3"></i>
    <h5 class="fw-bold">Check In for Today</h5>
    <p class="text-muted">{{ request.user.get_full_name }}</p>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">{{ form.notes }}</div>
      <button type="submit" class="btn btn-success w-100 fw-semibold"><i class="fas fa-sign-in-alt me-1"></i>Check In Now</button>
    </form>
    <a href="{% url 'attendance:list' %}" class="btn btn-link mt-2">Cancel</a>
  </div>
</div></div>
{% endblock %}
