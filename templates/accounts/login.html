{% extends 'base.html' %}
{% block auth_content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background:linear-gradient(135deg,#1e3a8a,#1e40af)">
  <div class="card p-4" style="width:400px">
    <div class="text-center mb-4">
      <i class="fas fa-tasks fa-2x text-primary mb-2"></i>
      <h4 class="fw-bold">TaskFlow</h4>
      <p class="text-muted small">Task & Attendance Management</p>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3"><label class="form-label fw-semibold">Username</label>{{ form.username }}</div>
      <div class="mb-3"><label class="form-label fw-semibold">Password</label>{{ form.password }}</div>
      {% if form.errors %}<div class="alert alert-danger small">Invalid credentials.</div>{% endif %}
      <button type="submit" class="btn btn-primary w-100 fw-semibold">Sign In</button>
    </form>
  </div>
</div>
{% endblock %}
