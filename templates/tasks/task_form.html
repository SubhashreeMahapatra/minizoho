{% extends 'base.html' %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card p-4">
      <h5 class="fw-bold mb-4">{{ title }}</h5>
      <form method="post">
        {% csrf_token %}
        <div class="row">
          {% for field in form %}
          <div class="col-md-{% if field.name == 'description' %}12{% else %}6{% endif %} mb-3">
            <label class="form-label fw-semibold">{{ field.label }}</label>{{ field }}
            {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
          </div>
          {% endfor %}
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Save Task</button>
          <a href="{% url 'tasks:list' %}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
