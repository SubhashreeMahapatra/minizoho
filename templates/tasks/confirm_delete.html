{% extends 'base.html' %}
{% block page_title %}Confirm Delete{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card p-4 text-center">
    <i class="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
    <h5>Delete Task?</h5>
    <p class="text-muted">Delete <strong>{{ object }}</strong>? This cannot be undone.</p>
    <form method="post" class="d-flex gap-2 justify-content-center mt-3">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="{% url 'tasks:list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div></div>
{% endblock %}
